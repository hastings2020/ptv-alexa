service: alexa-ptv-skill

frameworkVersion: '>=3.0.0 <4.0.0'

provider:
  name: aws
  runtime: nodejs18.x
  region: ap-southeast-2  # Sydney region (closest to Melbourne)
  stage: ${opt:stage, 'dev'}
  profile: ${opt:aws-profile, 'hastings-sso'}  # AWS profile to use
  memorySize: 256
  timeout: 10

  environment:
    # Secrets stored in AWS Systems Manager Parameter Store (encrypted with KMS)
    # The ~true suffix indicates SecureString type (encrypted)
    PTV_DEV_ID: ${ssm:/alexa-ptv-skill/${self:provider.stage}/ptv-dev-id~true}
    PTV_API_KEY: ${ssm:/alexa-ptv-skill/${self:provider.stage}/ptv-api-key~true}
    DYNAMODB_PERSISTENCE_TABLE_NAME: ${self:custom.tableName}

  iam:
    role:
      statements:
        # DynamoDB permissions for user preferences
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:GetItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:Scan
          Resource:
            - Fn::GetAtt: [AlexaPtvSkillTable, Arn]

        # Parameter Store permissions for reading encrypted secrets
        - Effect: Allow
          Action:
            - ssm:GetParameter
            - ssm:GetParameters
          Resource:
            - arn:aws:ssm:${self:provider.region}:*:parameter/alexa-ptv-skill/${self:provider.stage}/*

        # KMS permissions for decrypting SecureString parameters
        - Effect: Allow
          Action:
            - kms:Decrypt
          Resource:
            - "*"  # KMS key ARN - can be restricted to specific key if needed

custom:
  tableName: ${self:service}-${self:provider.stage}
  # Enable PITR in production
  pitrEnabled:
    prod: true
    staging: true
    dev: false

functions:
  alexaSkill:
    handler: lambda/index.handler
    description: Alexa skill for Melbourne PTV train departure times
    events:
      - alexaSkill:
          appId: ${env:ALEXA_SKILL_ID, ''}  # Optional: Add your skill ID for validation
          enabled: true

resources:
  Resources:
    # DynamoDB table for storing user preferences (home stations)
    AlexaPtvSkillTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.tableName}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        Tags:
          - Key: Service
            Value: ${self:service}
          - Key: Stage
            Value: ${self:provider.stage}

        # Enable Point-in-Time Recovery for production
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: ${self:custom.pitrEnabled.${self:provider.stage}, false}

        # Enable encryption at rest
        SSESpecification:
          SSEEnabled: true

  Outputs:
    AlexaSkillLambdaArn:
      Description: ARN of the Lambda function for Alexa Skill configuration
      Value:
        Fn::GetAtt: [AlexaSkillLambdaFunction, Arn]
      Export:
        Name: ${self:service}-${self:provider.stage}-lambda-arn

    DynamoDBTableName:
      Description: Name of the DynamoDB table for persistent attributes
      Value: ${self:custom.tableName}
      Export:
        Name: ${self:service}-${self:provider.stage}-table-name

plugins:
  - serverless-offline  # For local testing (optional)

package:
  patterns:
    - lambda/**
    - '!lambda/node_modules/aws-sdk/**'  # Exclude aws-sdk (provided by Lambda)
    - '!lambda/.env'  # Don't include local .env in deployment
    - '!tests/**'
    - '!*.md'
    - '!.git/**'
